name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build DocC archive
        run: |
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target Katana \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path Katana \
            --output-path ./docs

      - name: Patch root redirect
        run: |
          cat > ./docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./documentation/katana/">
              <title>Katana Documentation</title>
            </head>
            <body>
              <a href="./documentation/katana/">Continue to Katana documentation</a>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
